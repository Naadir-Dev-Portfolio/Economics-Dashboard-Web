name: Refresh economic data

on:
  schedule:
    # Data twice daily. News every hour (separate workflow could split, but
    # cheaper to combine into one cron).
    - cron: "30 6,18 * * *"   # full refresh: data + news
    - cron: "0 */1 * * *"     # news only (skips heavy data work)
  workflow_dispatch:
    inputs:
      mode:
        description: "Which fetcher to run"
        required: true
        default: "all"
        type: choice
        options: [all, data, news]
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Regression tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/frontend.test.cjs

      - name: Decide fetch mode
        id: mode
        run: |
          # Determine what to run:
          #  - manual dispatch  → uses inputs.mode
          #  - hourly cron      → news only
          #  - 6/18 cron        → all
          #  - push             → all (so config changes take effect immediately)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 */1 * * *" ]; then
            echo "mode=news" >> $GITHUB_OUTPUT
          else
            echo "mode=all" >> $GITHUB_OUTPUT
          fi

      - name: Fetch market & macro data
        if: steps.mode.outputs.mode != 'news'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/fetch_data.py

      - name: Fetch news & live events
        if: steps.mode.outputs.mode != 'data'
        run: python scripts/fetch_news.py
        continue-on-error: true

      - name: Rebuild economic calendar
        run: python scripts/fetch_calendar.py

      - name: Rebuild data-source health snapshot
        run: python scripts/build_health.py

      - name: Validate generated artifacts
        run: python scripts/validate_data.py

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            ts=$(date -u +"%Y-%m-%d %H:%MZ")
            git commit -m "chore(data): scheduled refresh ${ts} [${{ steps.mode.outputs.mode }}]"
            for attempt in 1 2 3; do
              git fetch origin main
              # During rebase, "theirs" is this generated-data-only commit.
              if ! git rebase -X theirs origin/main; then
                git rebase --abort
                exit 1
              fi
              python scripts/validate_data.py
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" = "3" ]; then
                echo "::error::main kept changing; generated data was not pushed."
                exit 1
              fi
              sleep 5
            done
          fi

      - name: Publish updated GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GITHUB_TOKEN pushes do not automatically trigger branch-based Pages.
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
          expected=$(git rev-parse HEAD)
          for attempt in $(seq 1 20); do
            sleep 15
            build=$(gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest")
            status=$(jq -r .status <<< "$build")
            commit=$(jq -r .commit <<< "$build")
            if [ "$commit" = "$expected" ] && [ "$status" = "built" ]; then
              echo "Published Pages at $expected."
              exit 0
            fi
            if [ "$commit" = "$expected" ] && [ "$status" = "errored" ]; then
              echo "::error::GitHub Pages build failed."
              exit 1
            fi
          done
          echo "::error::Timed out waiting for the updated Pages build."
          exit 1

      - name: Report source health
        if: always()
        run: python scripts/validate_data.py --report
