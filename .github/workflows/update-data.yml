name: Refresh economic data

on:
  schedule:
    # Data twice daily. News every hour (separate workflow could split, but
    # cheaper to combine into one cron).
    - cron: "30 6,18 * * *"   # full refresh: data + news
    - cron: "0 */1 * * *"     # news only (skips heavy data work)
  workflow_dispatch:
    inputs:
      mode:
        description: "Which fetcher to run"
        required: true
        default: "all"
        type: choice
        options: [all, data, news]
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Decide fetch mode
        id: mode
        run: |
          # Determine what to run:
          #  - manual dispatch  → uses inputs.mode
          #  - hourly cron      → news only
          #  - 6/18 cron        → all
          #  - push             → all (so config changes take effect immediately)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 */1 * * *" ]; then
            echo "mode=news" >> $GITHUB_OUTPUT
          else
            echo "mode=all" >> $GITHUB_OUTPUT
          fi

      - name: Fetch market & macro data
        if: steps.mode.outputs.mode != 'news'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/fetch_data.py

      - name: Fetch news & live events
        if: steps.mode.outputs.mode != 'data'
        run: python scripts/fetch_news.py
        continue-on-error: true

      - name: Rebuild economic calendar
        run: python scripts/fetch_calendar.py
        continue-on-error: true

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            ts=$(date -u +"%Y-%m-%d %H:%MZ")
            git commit -m "chore(data): scheduled refresh ${ts} [${{ steps.mode.outputs.mode }}]"
            # Pull rebase in case the other cron raced us
            git pull --rebase --autostash origin main || true
            git push
          fi
